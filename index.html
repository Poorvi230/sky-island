<!DOCTYPE html>
<html lang="en">
    <head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>SKY ISLAND!!</title>
       <link rel="preconnect" href="https://fonts.googleapis.com">
       <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
       <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&display=swap" rel="stylesheet">
       <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="game-container">

        <div id="sky-background"></div>
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="hud" class="hidden">
                <div class="score-pill">
                    SCORE: <span id="score">0</span> | COINS: <span id="hud-coins">0</span>
                </div>
            </div>
            <div id="start-screen" class="modal">
                <div id="shop-screen" class="modal hidden">
                    <h2>Skin SHOP</h2>
                    <div class="controls-info">
                        BANK: <span id="bank-coins">0</span> COINSS
                    </div>
                    <div class="shop-items" style="display: flex; gap: 20px; justify-content: center; margin: 20px 0;">
                        <div class="shop-item" id="skin-pink" style="border: 2px solid #FF007F; padding: 10px; cursor: pointer; border-radius: 10px;">
                            <div style="width: 40px; height: 40px; background: #FF007F; margin: 0 auto;"></div>
                            <p style="margin-top: 10px;">Defalut<br>Owned</p>
                        </div>
                        <div class="shop-item" id="skin-cyan" style="border: 2px solid #2abbb1; padding: 10px; cursor: pointer; border-radius: 10px;">
                            <div style="width: 40px; height: 40px; background: #2abbb1; margin: 0 auto;"></div>
                            <p style="margin-top: 10px;">Cyan Shine<br>50 Coins</p>
                        </div>
                    </div>
                    <button id="close-shop-btn">BACK</button>
                </div>
                <h1>SKY ISLAND</h1>
                <div class="controls-info">
                    Use A/D or arrow keys.<br>
                    Tap left / right on mobile!          
                </div>
                <button id="start-btn">LESGOOO</button>
            </div>
            <button id="shop-btn" style="background: #FFD700; color: #000; margin-top: 10px;">OPEN DA SHAWP</button>
            <div id="game-over-screen" class="modal hidden">
                <h2>REKT!</h2>
                <div class="stats">
                    <p>FINAL SCORE: <span id="final-score">0</span></p>
                    <p>BEST SCORE: <span id="best-score">0</span></p>
                </div>
                <button id="restart-btn">AGAIN</button>
            </div>
        </div>

        <script src="game.js"></script>
</body>
</html>
